name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate skills (frontmatter, description budget, README sync)
        run: npx tsx scripts/validate-skills.ts

      - name: Installer dry-run (all platforms)
        run: npx tsx cli.ts install all --dry-run
